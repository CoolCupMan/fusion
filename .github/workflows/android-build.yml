name: Build Fusion APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/fusion.keystore \
            -storepass fusion123 -keypass fusion123 -alias fusion \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Fusion, OU=Fusion, O=Fusion, L=NA, ST=NA, C=NA"

      - name: Build signed fusion.apk (unique app id)
        run: ./gradlew --no-daemon assembleRelease -PfusionBuildId=${{ github.run_number }}

      - name: Collect fusion.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/fusion.apk
          ls -la dist

      - name: Upload fusion.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusion-apk
          path: dist/fusion.apk
          if-no-files-found: error

      # Publish the raw fusion.apk as a Release asset so it downloads as a real
      # .apk (not a zip) and installs directly. Each build is a new release, so
      # every version has a unique app id and installs in parallel.
      - name: Publish fusion.apk to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fusion build ${{ github.run_number }}
          body: |
            Single, directly-installable **fusion.apk** (app id `com.fusion.firewall.v${{ github.run_number }}`).
            Installs in parallel with any other Fusion build. Enable "install from unknown sources", then open the file.
          files: dist/fusion.apk
          prerelease: true
          make_latest: true
